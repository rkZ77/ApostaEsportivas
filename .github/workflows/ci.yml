# CI do Pickia (12/09/2026).
#
# O repo tinha 3.700 testes e nenhum gatilho: eles so' rodavam quando alguem
# lembrava de rodar na maquina. Um push pra `dev` podia quebrar o motor sem
# nenhum sinal ate' o deploy.
#
# As tres pernas sao independentes de proposito -- quebra no frontend nao
# esconde quebra no motor, e o log de cada uma abre direto no que falhou.
#
# Nenhum job toca banco: `website/backend/tests/conftest.py` derruba
# `get_connection` na suite inteira, e a suite do motor tem a mesma trava. E'
# por isso que este workflow nao precisa de nenhum secret pra rodar.

name: CI

on:
  push:
    branches: [main, dev, noprod]
  pull_request:
    branches: [main, dev]

# Push novo na mesma branch cancela a execucao anterior: sem isso, uma
# sequencia de commits enfileira builds que ja nasceram obsoletos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/backend/requirements.txt
      - name: Instalar dependencias
        working-directory: website/backend
        # requirements-dev.txt ja' puxa o requirements.txt com `-r`.
        run: pip install -r requirements-dev.txt
      # `main.py` so' REGISTRA as rotas do SPA se `backend/dist` existir, e a
      # checagem e' no import (linha `if _dist.exists()`). Numa maquina de
      # desenvolvimento a pasta esta la porque alguem ja buildou; num checkout
      # limpo ela nao existe, e os testes do catch-all respondiam 404 em vez do
      # arquivo. Nao adianta buildar o frontend aqui: esses testes montam o
      # proprio dist de mentira com `monkeypatch` e so' precisam que a rota
      # tenha nascido. Entao o que falta e exatamente isto, um index.html vazio.
      - name: Marcar presenca do dist (as rotas do SPA nascem no import)
        working-directory: website/backend
        run: |
          mkdir -p dist
          echo '<!doctype html>' > dist/index.html
      - name: Testes
        working-directory: website/backend
        # Valor de mentira de proposito: dois testes importam o coletor de
        # estatisticas, que estoura no import sem a variavel. Nenhuma chamada
        # de rede sai daqui -- a suite proibe banco e mocka o provedor -- entao
        # a chave nunca e usada, so' precisa existir.
        env:
          API_FOOTBALL_KEY: chave-de-mentira-para-o-ci
        run: python -m pytest tests -q

  motor:
    name: Motor de picks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ApostaEsportivas/requirements.txt
      - name: Instalar dependencias
        working-directory: ApostaEsportivas
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Testes
        working-directory: ApostaEsportivas
        run: python -m pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: website/frontend
        run: npm ci
      # O `npm run build` ja roda `tsc` antes do vite (ver o script "build"),
      # entao um typecheck separado seria a mesma checagem duas vezes. O que o
      # build acrescenta e o que so' quebra depois do tsc: o prerender do hero
      # e a geracao do indice do blog.
      - name: Build
        working-directory: website/frontend
        run: npm run build
