<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Fontes. Estavam num @import dentro do index.css, o que serializa o
      download: o navegador só descobria o Google Fonts depois de baixar e
      parsear o CSS inteiro. Aqui elas entram já no HTML, com preconnect,
      e o handshake acontece em paralelo com o resto.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />

    <!-- Primary Meta -->
    <title>Pick IA · Picks de Futebol com Inteligência Artificial</title>
    <meta name="description" content="Picks de futebol gerados por IA com análise estatística real. Cobertura diária de Brasileirão, Champions League, Premier League e La Liga. VIP, múltiplas, alavancagem e picks gratuitos. Teste grátis por 2 dias." />
    <meta name="keywords" content="picks futebol, apostas esportivas IA, inteligência artificial apostas, palpites futebol hoje, picks brasileirão, picks champions league, pick ia, apostas com IA" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Pick IA" />
    <meta name="theme-color" content="#0a0a0c" />

    <!-- Canonical -->
    <link rel="canonical" href="https://pickia.com.br/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://pickia.com.br/" />
    <meta property="og:site_name"   content="Pick IA" />
    <meta property="og:title"       content="Pick IA · Picks de Futebol com Inteligência Artificial" />
    <meta property="og:description" content="Picks de futebol gerados por IA com análise estatística real. VIP, múltiplas, alavancagem. Brasileirão, Champions League, Premier League e La Liga. Teste grátis por 2 dias." />
    <meta property="og:image"       content="https://pickia.com.br/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="pt_BR" />

    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@pickia.br" />
    <meta name="twitter:title"       content="Pick IA · Picks de Futebol com Inteligência Artificial" />
    <meta name="twitter:description" content="Picks de futebol gerados por IA. Análise estatística, gestão de banca e picks diários para Brasileirão e as principais ligas europeias." />
    <meta name="twitter:image"       content="https://pickia.com.br/og-image.png" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Pick IA",
      "url": "https://pickia.com.br",
      "logo": "https://pickia.com.br/logo.png",
      "description": "Plataforma de picks esportivos gerados por inteligência artificial para futebol.",
      "sameAs": ["https://www.instagram.com/pickia.br/"]
    }
    </script>

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pick IA",
      "url": "https://pickia.com.br",
      "description": "Picks de futebol com inteligência artificial",
      "inLanguage": "pt-BR"
    }
    </script>

    <!--
      O SoftwareApplication com as ofertas NÃO fica aqui.

      Estava fixo neste arquivo e ficou anunciando R$ 49,90 pro Google enquanto
      a cobrança real era R$ 39,90, porque ninguém lembra de editar HTML estático
      ao reajustar preço. Agora ele é montado em pages/Home.tsx a partir de
      GET /api/payments/plans, que é a mesma tabela que o MercadoPago cobra.

      Não recolocar preço aqui.
    -->

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L801QMZ5ZS"></script>
    <script src="/gtag.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pick IA" />
  </head>
  <body class="bg-surface-0 text-ink-2">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
