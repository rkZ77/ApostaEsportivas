<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Tema. Este script tem que ser SINCRONO e vir antes do CSS.

      O tema escolhido mora no localStorage, que so' pode ser lido por JS. Se
      quem escolheu o claro tivesse que esperar o React montar pra saber disso,
      toda visita comecaria com um flash de tela preta antes de virar branca ·
      e um flash de tela preta e' pior do que nao ter tema claro.

      Ele nao le prefers-color-scheme de proposito: o padrao do site e' o
      escuro, e seguir o sistema viraria o produto do avesso sozinho pra quem
      usa o celular no modo claro. Ver src/lib/theme.ts (mesma chave).
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('pickia_theme') === 'light') {
            document.documentElement.dataset.theme = 'light'
          }
        } catch (e) {}
      })()
    </script>

    <!--
      AS QUATRO CHAMADAS DO TOPO DA HOME COMECAM AQUI, E NAO NO REACT.

      Elas desenham a primeira tela: dica do dia, fila de jogos, indicadores e
      preco. Saindo do React, so' partiam depois de o bundle baixar, avaliar e
      montar · medido em 04/09, ~1,2 s depois do primeiro byte num celular em
      4G. Nesse tempo todo o servidor estava ocioso, esperando o navegador
      terminar de ler JavaScript pra so' entao ser perguntado.

      `credentials: 'include'` porque a sessao e' cookie httpOnly: a resposta
      que chega aqui e' a MESMA que o axios receberia, logado ou nao. Resposta
      ruim (401, 500, rede) e' descartada e a chamada normal acontece como se
      nada tivesse sido pre-carregado · ver src/services/precarga.ts.

      So' na Home. Em outra rota isto seriam quatro requisicoes jogadas fora.
    -->
    <script>
      if (location.pathname === '/') {
        window.__pickia_precarga = {}
        var alvos = [
          '/api/public/next-fixtures?limit=30',
          '/api/public/results?recent_limit=1&slim=1',
          '/api/payments/plans',
        ]
        /*
         * A DICA DO DIA SO' ENTRA PRA QUEM NAO TEM SESSAO GUARDADA.
         *
         * Ela e' a unica das quatro que muda conforme quem pergunta: anonimo
         * recebe o mercado como `locked`. Se o access token estiver vencido
         * (o refresh acontece depois, no app), esta chamada voltaria a versao
         * anonima e o assinante veria o proprio pick bloqueado ate recarregar
         * a pagina. As outras tres sao iguais para todo mundo.
         */
        try {
          if (!localStorage.getItem('user')) alvos.unshift('/api/public/free-pick-today')
        } catch (e) {}
        alvos.forEach(function (u) {
          window.__pickia_precarga[u] = fetch(u, { credentials: 'include' })
            .then(function (r) { return r.ok ? r.json() : undefined })
            // `undefined` em vez de rejeitar: ninguem esta esperando esta
            // Promise ainda, e uma rejeicao sem dono vira erro vermelho no
            // console de toda visita com a rede ruim.
            .catch(function () { return undefined })
        })
      }
    </script>

    <!--
      Fontes. Elas sao NOSSAS, de /fonts (ver src/fontes.css e
      scripts/baixar-fontes.mjs).

      O <link> pro fonts.googleapis.com que morava aqui era CSS bloqueante em
      outro dominio: antes do primeiro pixel o celular pagava DNS + TLS pro
      googleapis, baixava o CSS, descobria o gstatic la' dentro e pagava DNS +
      TLS de novo pra so' entao comecar o woff2. Tres idas e voltas em serie,
      a maior fatia dos 750 ms de bloqueio de renderizacao medidos no PageSpeed.

      O preload abaixo e' so' da Nunito latin, que e' a fonte de tudo o que
      aparece na primeira tela. A Inter (usada apenas nos numeros, ver
      .font-mono) e o latin-ext ficam de fora: preload demais compete por banda
      com o proprio JavaScript e atrasa o que ele deveria adiantar.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/nunito-latin.woff2"
      crossorigin
    />

    <!--
      BARRA DE CARREGAMENTO INICIAL.

      Ela vive aqui, em HTML e CSS puros, e nao no React. O motivo e' o unico
      pedaco da espera que o React nao consegue cobrir: entre o navegador
      receber o HTML e o bundle terminar de baixar, parsear e montar, a tela
      fica parada. Antes esse trecho era uma tela vazia seguida de um spinner
      centralizado · duas telas de "nada" antes da primeira de verdade.

      A animacao e' CSS, entao ela ja esta andando enquanto o JavaScript baixa,
      inclusive em conexao ruim, que e' exatamente quando ela importa.

      Ela cresce ate' 90% e para (mesma ilusao da TopProgressBar: o navegador
      nao sabe a fracao real). Quem a encerra e' o React, pondo `pronto` no
      <html> quando a primeira tela esta montada · ver src/lib/barraInicial.ts.
    -->
    <style>
      #barra-inicial {
        position: fixed; inset-inline: 0; top: 0; height: 3px;
        z-index: 200; pointer-events: none;
      }
      #barra-inicial > span {
        display: block; height: 100%; width: 0;
        background: #00CC00;
        animation: barra-inicial-anda 9s cubic-bezier(0.05, 0.8, 0.2, 1) forwards;
      }
      @keyframes barra-inicial-anda {
        0%   { width: 0%; }
        12%  { width: 32%; }
        40%  { width: 62%; }
        100% { width: 90%; }
      }
      /* Salta pro fim e some · o salto tem que ser visto antes do fade, senao
         a barra parece ter desistido no meio. */
      html.pronto #barra-inicial > span {
        width: 100%;
        animation: none;
        transition: width 180ms ease-out, opacity 200ms ease-out 160ms;
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #barra-inicial > span { animation-duration: 0.01s; width: 90%; }
      }
    </style>

    <!--
      O SoftwareApplication com as ofertas NÃO fica aqui.

      Estava fixo neste arquivo e ficou anunciando R$ 49,90 pro Google enquanto
      a cobrança real era R$ 39,90, porque ninguém lembra de editar HTML estático
      ao reajustar preço. Agora ele é montado em pages/Home.tsx a partir de
      GET /api/payments/plans, que é a mesma tabela que o MercadoPago cobra.

      Não recolocar preço aqui.
    -->

    <!--
      Google Analytics · CARREGADO DEPOIS DO SITE ESTAR DE PE'.

      O gtag.js sao ~95 KB de JavaScript que nao pintam um pixel: enquanto ele
      baixava e executava (mesmo com `async`), disputava banda e thread com o
      bundle do app. Era a maior parte do "JavaScript nao usado" e do trabalho
      de thread principal apontados no PageSpeed.

      A fila (`dataLayer`) e o `gtag()` sao criados aqui, sincronos e de graca,
      entao nada se perde: os eventos disparados antes da hora ficam
      empilhados e o gtag.js os processa quando chega. O que foi adiado e' so'
      o download, pro `load` da pagina · momento em que a primeira tela ja'
      esta' pintada e a medicao nao custa nada ao usuario.

      Isto substitui o public/gtag.js, que existia so' pra rodar estas quatro
      linhas num arquivo separado (mais um pedido de rede pelo mesmo efeito).
    -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() { dataLayer.push(arguments) }
      gtag('js', new Date())
      gtag('config', 'G-L801QMZ5ZS')
      addEventListener('load', function () {
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-L801QMZ5ZS'
        document.head.appendChild(s)
      })
    </script>
