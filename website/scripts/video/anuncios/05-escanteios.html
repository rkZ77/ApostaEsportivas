<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PickIA · 05 · Análise de escanteios</title>
<link rel="stylesheet" href="base.css">
<style>
.campo { position: absolute; left: 60px; top: 520px; width: 960px; height: 560px; }
.campo .lin { fill: none; stroke: rgba(255,255,255,.35); stroke-width: 3; }
.arco { fill: none; stroke: var(--g); stroke-width: 6; filter: drop-shadow(0 0 10px #00cc00); animation: pisca 1.2s ease-in-out infinite; }
@keyframes pisca { 50% { opacity: .25; } }
.traj { fill: none; stroke: #fff; stroke-width: 4; stroke-dasharray: 1; stroke-dashoffset: 1; stroke-linecap: round; opacity: .9; }
.slot { position: absolute; left: 70px; right: 70px; top: 1130px; height: 330px; padding: 28px 34px; }
.slot h4 { font: 700 34px/1 Inter; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 14px; }
.slot h4 .n { font: 700 22px/1 var(--mono); color: var(--g); }
.duas { display: flex; gap: 30px; margin-top: 30px; }
.duas > div { flex: 1; border-radius: 20px; background: var(--s2); border: 1.5px solid var(--line2); padding: 22px 26px; }
.duas b { display: block; font: 700 76px/1 var(--mono); margin-top: 10px; }
.hbar { display: flex; align-items: center; gap: 16px; margin-top: 22px; font: 600 24px/1 Inter; color: var(--ink2); }
.hbar span { width: 230px; }
.hbar i { flex: 1; height: 26px; border-radius: 13px; background: var(--s3); position: relative; overflow: hidden; }
.hbar i b { position: absolute; inset: 0; border-radius: 13px; transform-origin: left; animation: grow2 .8s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--at) * 1s); }
.hbar em { font: 700 30px/1 var(--mono); font-style: normal; width: 70px; text-align: right; }
.jogos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-top: 30px; }
.jogos div { border-radius: 16px; background: var(--s2); border: 1.5px solid var(--line2); text-align: center; padding: 18px 0; }
.jogos small { display: block; font: 600 18px/1 Inter; color: var(--ink3); }
.jogos b { display: block; font: 700 46px/1 var(--mono); margin-top: 10px; }
.orbita { position: absolute; left: 540px; top: 940px; width: 0; height: 0; }
.orbita .nucleo { position: absolute; left: -170px; top: -170px; width: 340px; height: 340px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle, rgba(0,204,0,.25), rgba(0,204,0,.05) 70%); border: 3px solid var(--g); box-shadow: 0 0 80px rgba(0,204,0,.4); font: 800 40px/1.1 Inter; text-transform: uppercase; }
.orbita .sat { position: absolute; transform: translate(-50%, -50%); }
</style>
</head>
<body data-dur="22" data-cortes="3,14,18">
<div id="stage">

  <section class="scene" data-in="0" data-out="3">
    <div class="abs cx a zoomin" style="--at:0;top:250px;font:700 360px/1 var(--mono);color:var(--g);text-shadow:0 0 80px rgba(0,204,0,.5)" id="numero">9.5</div>
    <h1 class="hl abs cx" style="top:800px">
      <span class="ln split fit" data-at=".5" style="font-size:112px">Escanteios não são</span>
      <span class="ln fit a slam" style="--at:.9;font-size:150px"><em>só um número.</em></span>
    </h1>
  </section>

  <section class="scene" data-in="3" data-out="14">
    <div class="abs cx a down" style="--at:3;top:190px"><span class="kicker" style="font-size:32px">Análise de escanteios</span></div>
    <div class="abs cx a up" style="--at:3.1;top:260px;display:flex;justify-content:center;align-items:center;gap:26px;font:700 50px/1 Inter">
      <span class="neutro" style="width:96px;height:96px;background:#1f6f3f">M</span>Mandante <span style="color:var(--ink4);font-size:32px">x</span> Visitante<span class="neutro" style="width:96px;height:96px;background:#2b4c8a">V</span>
    </div>
    <div class="abs cx a fade" style="--at:3.3;top:400px"><span class="ilus">Dados ilustrativos</span></div>

    <svg class="campo a fade" style="--at:3.2" viewBox="0 0 960 560">
      <rect class="lin" x="10" y="10" width="940" height="540" rx="6"/>
      <line class="lin" x1="480" y1="10" x2="480" y2="550"/><circle class="lin" cx="480" cy="280" r="70"/>
      <rect class="lin" x="10" y="140" width="130" height="280"/><rect class="lin" x="820" y="140" width="130" height="280"/>
      <rect class="lin" x="10" y="215" width="45" height="130"/><rect class="lin" x="905" y="215" width="45" height="130"/>
      <path class="arco" d="M10 40 A30 30 0 0 0 40 10"/><path class="arco" d="M920 10 A30 30 0 0 0 950 40" style="animation-delay:-.3s"/>
      <path class="arco" d="M10 520 A30 30 0 0 1 40 550" style="animation-delay:-.6s"/><path class="arco" d="M920 550 A30 30 0 0 1 950 520" style="animation-delay:-.9s"/>
      <path class="traj" pathLength="1" d="M945 15 Q 840 120 870 250" style="animation:draw .7s ease-out both;animation-delay:3.8s"/>
      <path class="traj" pathLength="1" d="M945 545 Q 830 430 880 300" style="animation:draw .7s ease-out both;animation-delay:5.6s"/>
      <path class="traj" pathLength="1" d="M15 15 Q 120 110 90 260" style="animation:draw .7s ease-out both;animation-delay:7.6s"/>
      <path class="traj" pathLength="1" d="M15 545 Q 140 440 80 310" style="animation:draw .7s ease-out both;animation-delay:9.6s"/>
      <path class="traj" pathLength="1" d="M945 15 Q 860 160 860 290" style="animation:draw .7s ease-out both;animation-delay:11.6s"/>
    </svg>

    <div class="slot card a up" style="--at:4.4" id="slot"></div>
  </section>

  <section class="scene" data-in="14" data-out="18">
    <h1 class="hl abs cx" style="top:200px">
      <span class="ln split fit" data-at="14.05" style="font-size:112px">A PickIA analisa</span>
      <span class="ln fit a slam" style="--at:14.35;font-size:140px"><em>o contexto.</em></span>
    </h1>
    <div class="orbita">
      <div class="nucleo a pop" style="--at:14.3">Escan-<br>teios</div>
      <div id="sats"></div>
    </div>
    <div class="abs a rise" style="--at:15.2;left:140px;top:1340px;width:800px;height:420px;border-radius:30px;overflow:hidden;border:3px solid #2b2b31">
      <img id="real" style="width:100%;position:absolute;top:-150px" alt="">
    </div>
    <div class="abs cx a fade" style="--at:15.5;top:1780px"><span class="ilus">Tela real · mercados de escanteios no histórico público</span></div>
  </section>

  <section class="scene endcard" data-in="18" data-out="22.01" data-l1="Análise de" data-l2="escanteios." data-f1="96" data-f2="150"></section>
</div>

<script src="base.js"></script>
<script>
/* Números de times genéricos (Mandante x Visitante), marcados como
   ilustrativos: a análise real de cada jogo é conteúdo de assinante. O que é
   real aqui é o recorte de /palpites-de-futebol-hoje no fim, com as linhas de
   escanteio que a PickIA publicou. */
const PAINEIS = [
  [4.4, 'Média', `<div class="duas"><div><span class="lbl">Mandante</span><b data-fl="3,8,1" data-stop="5.2" data-v="5.8">5.8</b></div><div><span class="lbl">Visitante</span><b data-fl="3,8,1" data-stop="5.3" data-v="4.1">4.1</b></div></div>`],
  [6.5, 'Histórico', `<div class="bars" style="height:200px;margin-top:30px">${[.5,.7,.4,.9,.6,.8,.55,1,.65,.75].map((h, j) => `<i style="--h:${h};--at:${6.7 + j * .05}"></i>`).join('')}</div>`],
  [8.6, 'Casa / fora', `<div class="hbar"><span>Mandante em casa</span><i><b style="background:var(--g);transform:scaleX(.74);--at:8.8"></b></i><em>6.4</em></div><div class="hbar"><span>Visitante fora</span><i><b style="background:#3b6fd8;transform:scaleX(.52);--at:8.95"></b></i><em>3.9</em></div><div class="hbar"><span>Linha da casa</span><i><b style="background:#55555f;transform:scaleX(.63);--at:9.1"></b></i><em>9.5</em></div>`],
  [10.7, 'Últimos jogos', `<div class="jogos">${[11, 8, 12, 7, 10].map((v, j) => `<div class="a pop" style="--at:${10.9 + j * .1}"><small>J${j + 1}</small><b>${v}</b></div>`).join('')}</div>`],
  [12.4, 'Estatísticas', `<div class="hbar"><span>Cruzamentos</span><i><b style="background:var(--g);transform:scaleX(.68);--at:12.6"></b></i><em>21</em></div><div class="hbar"><span>Chutes bloqueados</span><i><b style="background:var(--g);transform:scaleX(.45);--at:12.7"></b></i><em>5</em></div><div class="hbar"><span>Ataques pelos lados</span><i><b style="background:var(--g);transform:scaleX(.8);--at:12.8"></b></i><em>64%</em></div>`],
];
A.montar(() => {
  // os cinco paineis existem desde o inicio, empilhados; o quadro mostra um por vez
  slot.innerHTML = PAINEIS.map(([t0, nome, corpo], i) =>
    `<div class="pn" data-i="${i}" style="position:absolute;inset:28px 34px"><h4><span class="n">0${i + 1}</span>${nome}</h4>${corpo}</div>`).join('');
  const S = ['Mando de campo', 'Forma recente', 'Adversário', 'Linha oferecida', '1º e 2º tempo', 'Histórico'];
  sats.innerHTML = S.map((s, i) => {
    const a = i / S.length * Math.PI * 2 - Math.PI / 2;
    return `<div class="sat" style="left:${Math.cos(a) * 380}px;top:${Math.sin(a) * 250}px"><span class="chip g a pop" style="--at:${14.6 + i * .15}">${s}</span></div>`;
  }).join('');
  real.src = A.tela('palpites-resolvidos');
});
A.quadro(t => {
  let vez = 0;
  PAINEIS.forEach((p, i) => { if (t >= p[0]) vez = i; });
  slot.querySelectorAll('.pn').forEach((p, i) => p.style.visibility = i === vez ? '' : 'hidden');
  // o 9.5 do gancho se desfaz antes do texto ocupar a tela
  const k = A.clamp((t - 2.2) / .6);
  numero.style.filter = `blur(${k * 20}px)`; numero.style.opacity = 1 - k * .8;
  sats.style.transform = `rotate(${0}deg)`;
});
</script>
</body>
</html>
